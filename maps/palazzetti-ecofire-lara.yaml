# Palazzetti Ecofire Lara (air stove, Micronova-family controller).
# Evidence:
#   notes-2020  : manual observations while toggling settings (private repo notes/2020-palazzetti-repo)
#   dump-2020   : 47 h RAM capture 2020-02-10..12, 13 838 full scans, 4 on/off cycles
#                 (private repo dumps/2020-02-10-ram, analysed with `plz analyze`)
# The Lara does NOT follow the generic Micronova RAM layout: entries with status `refuted`
# document generic addresses that were checked and do not hold the generic meaning here.
profile: palazzetti-ecofire-lara
title: Palazzetti Ecofire Lara
sources:
  service-menu: Owner service-menu notes, private palazzetti-ecofire-lara/settings/manu-sav.md; observation date and firmware unknown
  esphome-representation: "ESPHome Micronova sensor implementations: https://github.com/esphome/esphome/blob/dev/esphome/components/micronova/sensor/__init__.py and https://esphome.io/components/micronova/ (reviewed 2026-10-11); other stoves, not Lara address evidence"
  ridiculouslab: "Micronova protocol analysis: https://www.ridiculouslab.com/arguments/iot/stufa/micronova_en.php (reviewed 2026-10-11); RAM mapping only, not Lara or EEPROM evidence"
  forum-representation: "Third-party parameter formulas: https://stufapellet.forumcommunity.net/?t=53061907 (historical table retained in private notes/2020-palazzetti-repo/NOTES); not Lara offsets or safe ranges"
  eni23-representation: "L'Asolana Marina mapping: https://github.com/eni23/micronova-controller (README reviewed 2026-10-11); decimal live clock versus BCD stored clock and 10-minute schedule units are candidates only for Lara"
  connbox-2020: Connection Box disassembly notes (2020), private repo notes/2020-palazzetti-repo/COMMANDS; model branch not verified on Lara
  connbox-69055a28: "Own static analysis of private plzbridge MD5 69055a2889734015f2bc6b1b6db4c2d6 (2026-10-11), functions 40D7F8 and 40D98C; corrects historical model-dispatch interpretation, not Lara mapping evidence"
  notes-2020: Manual observations (2020), private repo notes/2020-palazzetti-repo
  dump-2020: RAM capture 2020-02-10..12, private repo dumps/2020-02-10-ram
  dump-2020-02-08: Timestamped RAM polling in private reverse repo legacy/2020-backup/out2 (2020-02-08, 1.76 h); successful callbacks only, raw checksums unavailable
fields:
  # ---- state machine ---------------------------------------------------------------
  - id: power_state
    category: State & phases
    mem: ram
    addr: 0xF9
    name: Power state
    status: observed
    sources: [notes-2020, dump-2020]
    evidence:
      - {source: notes-2020, origin: own, method: panel_match, supports: [address, meaning], claim: "Owner notes associate F9 states with off, starting, working and stopping; no command semantics established."}
      - {source: dump-2020, origin: own, method: variation, supports: [meaning], claim: "Four historical cycles follow the recorded state sequence. Accepted legacy callbacks are not newly checksum-validated wire evidence."}
    values:
      0x1A: "off"
      0x2B: ignition
      0x4B: working
      0x1D: final cleaning
    notes: >-
      Ignition lasts ~20 min, final cleaning ~10 min. All four cycles of the dump follow
      off → ignition → working → final cleaning → off.
  - id: power_state_aux
    category: State & phases
    mem: ram
    addr: 0xFA
    name: Power state (secondary)
    status: observed
    sources: [notes-2020, dump-2020]
    values:
      0x32: "off"
      0x35: ignition or working
      0x3B: final cleaning
  - id: phase_step
    category: State & phases
    mem: ram
    addr: 0x6C
    name: Phase step / sequencer position
    status: hypothesis
    sources: [notes-2020, dump-2020]
    evidence:
      - {source: dump-2020, origin: own, method: variation, supports: [meaning], claim: "Values correlate with the F9 phase; sequencer interpretation remains a hypothesis, not a command."}
    notes: 1 when off, 24–26 during ignition, 32–33 while working, 39/45/50 during final cleaning.
  - id: status
    category: State & phases
    mem: ram
    addr: 0x21
    name: Generic Micronova stove state
    status: refuted
    sources: [dump-2020]
    notes: Constant 5 during the whole dump, including on/off cycles. Do not use the generic on/off writes here.
  - id: phase_substep
    category: State & phases
    mem: ram
    addr: 0x4E
    name: Phase sub-step
    status: hypothesis
    sources: [dump-2020]
    notes: 0 off, 1–3 during ignition, 4 while working (6 briefly), 6 during final cleaning (η² 0.99 with 0xF9).
  - id: ignition_counter
    category: State & phases
    mem: ram
    addr: 0x3C
    name: Ignition counter
    status: hypothesis
    sources: [dump-2020]
    notes: Non-zero only during ignition, steps through 1–20 (~1 per minute over the ~20 min ignition).
  - id: onoff_0xd0
    category: State & phases
    mem: ram
    addr: 0xD0
    name: Unknown D0, follows on/off
    status: unknown
    sources: [dump-2020]
    notes: Mostly 8 when off, 88–90 during final cleaning, 56–90 while working. Pairs with 0xD2.
  - id: onoff_0xd2
    category: State & phases
    mem: ram
    addr: 0xD2
    name: Unknown D2, follows on/off
    status: unknown
    sources: [dump-2020]
    notes: Mostly 4–12 when off, 84–94 during final cleaning, 48–94 while working. Pairs with 0xD0.

  # ---- temperatures ---------------------------------------------------------------
  - id: fumes_temperature
    category: Temperatures
    mem: ram
    addr: 0x42
    name: Fumes temperature
    unit: °C
    status: observed
    sources: [notes-2020, dump-2020, dump-2020-02-08]
    evidence:
      - {source: notes-2020, origin: own, method: panel_match, supports: [address, meaning], claim: "Owner temperature observations support RAM 42 as fumes temperature; no new instrument comparison performed."}
      - {source: dump-2020, origin: own, method: variation, supports: [meaning, range], claim: "Historical evolution follows heating and cooling; recorded ranges are observations, not safe bounds or defaults."}
      - {source: ridiculouslab, origin: external, method: source_table, supports: [encoding], claim: "Reports unit-scale flue temperature on another board at RAM 5A. Useful representation comparison only; 5A temperature is refuted on Lara."}
    notes: >-
      12–58 °C off, 68–133 °C working in the later capture. In the February 8 capture,
      25–124 (23 distinct values). RAM 0x4B tracks this value; sequential polling
      can differ while temperature changes, so it is not an atomic mirror.
  - id: fumes_temperature_mirror
    category: Temperatures
    mem: ram
    addr: 0x4B
    name: Fumes temperature (copy)
    unit: °C
    status: observed
    sources: [dump-2020]
  - id: room_temperature
    category: Temperatures
    mem: ram
    addr: 0x49
    name: Room temperature
    unit: °C
    status: hypothesis
    sources: [dump-2020, dump-2020-02-08]
    evidence:
      - {source: dump-2020, origin: own, method: variation, supports: [meaning], claim: "Slow 19–27 evolution is temperature-like; probe identity and conversion are not confirmed by a panel match."}
      - {source: esphome-representation, origin: external, method: source_code, supports: [encoding], claim: "Other-board ambient temperature uses raw/2. Test this against paired Lara readings rather than importing address 01 or assuming unit scale."}
    notes: >-
      19–27 °C, slow, rises while the stove works. February 8 capture: 21–27,
      6 distinct values; this supports temperature-like evolution but does not identify the probe.
  - id: board_temperature
    category: Temperatures
    mem: ram
    addr: 0x4A
    name: Temperature (board or ambient probe close to the stove)
    unit: °C
    status: hypothesis
    sources: [notes-2020, dump-2020, dump-2020-02-08]
    notes: >-
      20–24 °C off, up to 36 °C while working. February 8 capture: 24–34,
      7 distinct values; probe identity remains unverified.
  - id: room_temperature_generic
    category: Temperatures
    mem: ram
    addr: 0x01
    name: Generic Micronova room temperature
    status: refuted
    sources: [dump-2020]
    notes: Changes on almost every scan (0–84); looks like a fast counter or raw ADC value.
  - id: fumes_temperature_generic
    category: Temperatures
    mem: ram
    addr: 0x5A
    name: Generic Micronova fumes temperature
    status: refuted
    sources: [dump-2020]
    notes: >-
      Not a temperature on the Lara: 63 (0b00111111) when off, 255 while running, a few 191/127.
      Looks like a bit field (outputs or flags). The 2020 notes saw "high values, 0 after off".
  - id: running_flags
    category: State & phases
    mem: ram
    addr: 0x5A
    name: Running flags (bit field?)
    status: hypothesis
    sources: [notes-2020, dump-2020]


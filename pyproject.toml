[project]
name = "palazzetti-lab"
version = "0.1.0"
description = "Reverse-engineering lab for Micronova/Palazzetti pellet stoves (client of the ESPHome lab server)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
plz = "plz.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/plz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

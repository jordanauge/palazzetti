# Generic Micronova controller layout, as used by the ESPHome built-in `micronova`
# component defaults and most community projects. Many Palazzetti boards are NOT laid
# out like this (see palazzetti-ecofire-lara.yaml): treat every entry as "reported".
#
# Field keys: see maps/README.md.
profile: micronova-common
title: Micronova (generic, community consensus)
sources:
  esphome-code: "Current ESPHome sensor defaults and conversions: https://github.com/esphome/esphome/blob/dev/esphome/components/micronova/sensor/__init__.py (reviewed 2026-10-11); not Lara applicability"
  esphome-micronova: "ESPHome Micronova component defaults: https://esphome.io/components/micronova/"
  stufapellet: "StufaPellet community protocol/project: https://stufapellet.forumcommunity.net/?t=53061907 (original archive retained privately)"
  forum: Community table of a Micronova board (see micronova-forum.yaml)
fields:
  - id: room_temperature
    category: Temperatures
    mem: ram
    addr: 0x01
    name: Room temperature
    unit: °C
    scale: 0.5
    status: reported
    sources: [esphome-micronova, stufapellet]
    evidence:
      - {source: esphome-code, origin: external, method: source_code, supports: [address, meaning, encoding], claim: "ESPHome default room sensor reads RAM 01 and divides by two; not a Lara probe identification."}
  - id: water_temperature
    category: Temperatures
    mem: ram
    addr: 0x03
    name: Water temperature (hydro stoves)
    unit: °C
    scale: 0.5
    status: reported
    sources: [esphome-micronova, stufapellet]
  - id: auger_time
    category: Combustion & fans
    mem: ram
    addr: 0x0D
    name: Auger (screw) on-time
    status: reported
    sources: [forum]
  - id: status
    category: State & phases
    mem: ram
    addr: 0x21
    name: Stove state
    access: rw
    status: reported
    sources: [esphome-micronova, stufapellet]
    values:
      0: "off"
      1: start
      2: pellet loading
      3: ignition
      4: working
      5: brazier cleaning
      6: final cleaning
      7: standby
      8: no pellet alarm
      9: ignition failure alarm
      10: undefined alarm
    notes: Writing 0x01 switches on, 0x06 switches off (frames 80 21 01 A2 / 80 21 06 A7).
  - id: power_actual
    category: Combustion & fans
    mem: ram
    addr: 0x34
    name: Actual power level
    status: reported
    sources: [esphome-micronova, stufapellet]
    evidence:
      - {source: esphome-code, origin: external, method: source_code, supports: [address, meaning, encoding], claim: "ESPHome default power sensor reads RAM 34 with no divisor. Refuted as actual power in the Lara profile."}
  - id: fumes_fan_speed
    category: Combustion & fans
    mem: ram
    addr: 0x37
    name: Fumes extractor speed
    unit: rpm
    scale: 10
    status: reported
    sources: [esphome-micronova]
    evidence:
      - {source: esphome-micronova, origin: external, method: source_description, supports: [address, meaning, encoding], claim: "ESPHome default extractor address with raw times ten plus configurable model offset. Address and offset remain model-dependent."}
    notes: rpm = value × 10 + model specific offset (ESPHome `fan_rpm_offset`), 0 when stopped.
  - id: water_temperature_alt
    category: Temperatures
    mem: ram
    addr: 0x3B
    name: Water temperature (alternate address)
    unit: °C
    scale: 0.5
    status: reported
    sources: [esphome-micronova]
    evidence:
      - {source: esphome-code, origin: external, method: source_code, supports: [address, meaning, encoding], claim: "Current ESPHome water sensor default is RAM 3B divided by two. Other sources report unit scale; applicability is board-specific."}
  - id: water_pressure
    category: Combustion & fans
    mem: ram
    addr: 0x3C
    name: Water pressure
    unit: bar
    scale: 0.1
    status: reported
    sources: [esphome-micronova]
    evidence:
      - {source: esphome-code, origin: external, method: source_code, supports: [address, meaning, encoding], claim: "Current ESPHome default reads RAM 3C divided by ten. A hydro-specific parameter is not automatically present on an air stove."}
  - id: fumes_temperature
    category: Temperatures
    mem: ram
    addr: 0x5A
    name: Fumes temperature
    unit: °C
    status: reported
    sources: [esphome-micronova, stufapellet]
    evidence:
      - {source: esphome-code, origin: external, method: source_code, supports: [address, meaning, encoding], claim: "Current ESPHome default reads RAM 5A without a divisor. This temperature interpretation is refuted for Lara."}
  - id: target_temperature
    category: User settings
    mem: eeprom
    addr: 0x7D
    name: Thermostat set point
    unit: °C
    access: rw
    status: reported
    sources: [esphome-micronova]
  - id: power_setting
    category: User settings
    mem: eeprom
    addr: 0x7F
    name: Power level setting
    access: rw
    status: reported
    sources: [esphome-micronova]

  # ---- EEPROM (addresses are decimal in the 2020 notes) ---------------------------
  - id: chrono_programs
    category: Clock & scheduling
    mem: eeprom
    addr: 59
    count: 18
    name: Chrono programs 1–6, 3 bytes each (start, stop, days)
    access: rw
    status: hypothesis
    sources: [notes-2020]
    evidence:
      - {source: notes-2020, origin: own, method: panel_change, supports: [address], claim: "Notes record EEPROM 62 and 63 changing during program editing; which display value each byte represents is unresolved."}
      - {source: notes-2020, origin: own, method: adjacency, supports: [layout], claim: "Listed program starts suggest triplets beginning at decimal 59. Notes contain gaps/typos and the tentative end overlaps power at decimal 76; not a validated structure."}
      - {source: eni23-representation, origin: external, method: source_table, supports: [encoding], claim: "Another board stores schedule times in ten-minute units. Candidate representation only; Lara triplet times are not decoded."}
    notes: Triplet layout and start/stop byte encoding not decoded yet; EEPROM 62 went 0x43→0x42 and 63 went 0x54→0x57 while editing a program. Tentative region ends at 0x4C, overlapping the observed power setting; the six-triplet boundary is not established.
    members:
      - id: program_1
        name: Program 1
        byte_offset: 0
        count: 3
        members:
          - {id: start, name: Start time (encoding unknown), byte_offset: 0}
          - {id: stop, name: Stop time (encoding unknown), byte_offset: 1}
          - id: days
            name: Day selection
            byte_offset: 2
            status: observed
            values: {0: week, 1: mon-fri, 2: sat-sun, 3: monday, 4: tuesday, 5: wednesday, 6: thursday, 7: friday, 8: saturday, 9: sunday}
      - id: program_2
        name: Program 2 (hypothesized triplet)
        byte_offset: 3
        count: 3
        members:

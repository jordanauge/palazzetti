    mem: eeprom
    addr: 76
    count: 40
    name: Chrono programs 1–4 (start/stop in minutes ÷ 10, day flags)
    access: rw
    status: reported
    sources: [forum]
    evidence:
      - {source: forum, origin: external, method: source_table, supports: [address, meaning, encoding, layout], claim: "Historical table supplies four start/stop pairs in ten-minute units and seven day flags per program, with gaps. Not the Lara tentative triplets."}
    notes: Third-party layout; not the tentative six-triplet Lara layout. Slots at decimal 86, 96 and 106 are unassigned in the table. Day-flag values other than 0/1 are not established.
    members:
      - {id: enabled, name: Chrono enabled, byte_offset: 0}

name: Publish memory maps

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "maps/**"
      - "tools/plz/**"
      - "tests/test_maps.py"
      - "tests/test_memory_html.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  public:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - name: Validate maps and generator
        run: .venv/bin/pytest tests/test_maps.py tests/test_memory_html.py -q
      - name: Generate public atlas without private captures
        run: |
          .venv/bin/plz gen-html palazzetti-ecofire-lara -o docs
          mkdir -p _site
          cp docs/index.html docs/memory-ram.html docs/memory-eeprom.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Private repository deployment limitation
        if: github.event.repository.private
        run: echo "Atlas built. Pages deployment starts after this repository becomes public; enable Pages with GitHub Actions as the source." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

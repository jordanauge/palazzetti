# Reference extraction only; not a maintained or deployable Lara map.
# Derived facts from the supplied bridge; none establishes Lara applicability.
reference_only: true
profile: palazzetti-connbox
title: Palazzetti Connection Box (69055a28 build reference)
sources:
  connbox-2020: Connection Box firmware disassembly notes (2020), private repo notes/2020-palazzetti-repo/COMMANDS
  connbox-69055a28: "Own static analysis (2026-10-11), private plzbridge MD5 69055a2889734015f2bc6b1b6db4c2d6, SHA256 4fedc1bc89e47c1448dec277e6b9d5f2c44e6b5265aa7c86ea0818c4475b7562; see ../connection-box.md for public derived facts"
fields:
  - id: board_model
    category: Identification & constants
    mem: ram
    addr: 0x6E
    name: Micronova branch selector (not verified Lara model)
    status: reported
    sources: [connbox-69055a28]
    values: {1: type 12, 2: type 13, 3: type 14}
    notes: >-
      Function 40D7F8. Other successfully read values select type 11 (0B).
      Corrects historical RAM 0D claim; fallback is not proof of model compatibility.
  - id: feeder
    category: Combustion & fans
    mem: ram
    addr: 0x0D
    name: FEEDER (bridge layouts)
    scale: 0.1
    status: reported
    sources: [connbox-69055a28]
    notes: Function 40D98C divides by 10; GET ALLS emits FEEDER. Lara constant E8 is not identified by this formula.
  - id: status
    category: State & phases
    mem: ram
    addr: 0x21
    name: Stove state (target of SET STAT)
    access: rw
    status: reported
    sources: [connbox-69055a28]
    notes: Function 40D910 reads this byte. ON/OFF also writes other bytes first. Constant 5 on Lara refutes straightforward state mapping.
  - id: power_level
    category: Combustion & fans
    mem: ram
    addr: 0x37
    name: POWER (type 11)
    status: reported
    sources: [connbox-69055a28]
    notes: Function 40D98C. On Lara 0x37 behaves like fumes extractor speed, not this meaning.
  - id: power_level_aux
    category: Combustion & fans
    mem: ram
    addr: 0x64
    name: RPOWER (type 11)
    status: reported
    sources: [connbox-69055a28]
  - id: power_level_b
    category: Combustion & fans
    mem: ram
    addr: 0x97
    name: POWER (types 12-14)
    status: reported
    sources: [connbox-69055a28]
  - id: power_level_b_aux
    category: Combustion & fans
    mem: ram
    addr: 0x34
    name: RPOWER (types 12-14)
    status: reported
    sources: [connbox-69055a28]
    notes: Same address as the generic Micronova power level.
  - id: target_temperature
    category: User settings
    mem: ram
    addr: 0x36
    name: Target temperature (GET SETP, "0xB model")
    unit: °C
    status: reported
    sources: [connbox-69055a28]
    scale: 0.5
    notes: Function 40DB74 uses integer raw/2, truncating odd values. Scale summarizes representation, not exact fractional output.
  - id: target_temperature_alt
    category: User settings
    mem: ram
    addr: 0xA0
    name: Target temperature (GET SETP, other models)
    unit: °C
    status: reported
    sources: [connbox-69055a28]
  - id: parameters
    category: Service parameters
    mem: eeprom
    addr: 0x00
    count: 47
    name: Cached technical parameter bytes (EXT PARL)
    access: r
    status: reported
    sources: [connbox-69055a28]
    notes: Functions 40E054 and 401C80. Cache indices 0..46 loaded from EEPROM 00..2E; not storage capacity. GET PARM separately accepts 1..200 and reads address=index, without base28. PHP display row n uses cache index n-1.

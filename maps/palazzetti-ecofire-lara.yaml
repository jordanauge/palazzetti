      - {source: esphome-representation, origin: external, method: source_description, supports: [encoding], claim: "Other-board rpm representation is raw times 10 plus a model-dependent offset. Lara offset is not established."}
    notes: 0 when off, 135–249 while running (same address as generic Micronova). RAM 0x39 tracks it.
  - id: fumes_fan_speed_mirror
